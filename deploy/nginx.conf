# HTTP bootstrap; enable HTTPS before accepting real form submissions.
server {
    listen 80;
    server_name maxxdev.ru;
    client_max_body_size 24k;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 80;
    server_name www.maxxdev.ru;
    return 301 https://maxxdev.ru$request_uri;
}
